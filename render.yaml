# Render Blueprint — provisions the NestJS API + a managed Postgres.
#
# Redis is deliberately NOT included here: nothing in the app actually uses
# it yet (REDIS_URL exists in .env.example only for a future background-jobs
# phase — grep confirms zero BullMQ/Redis client usage in src/ as of this
# writing). Provisioning it now would mean paying for and securing
# infrastructure with no code depending on it. See DEPLOYMENT.md for how to
# add it in one line once something actually needs it.
#
# The Next.js frontend is deployed separately on Vercel — see DEPLOYMENT.md.

databases:
  - name: smm-staging-postgres
    # Free tier — no card required, but Render auto-deletes free Postgres
    # instances after 90 days. Fine for evaluating staging deployability;
    # revisit before this needs to stay up for real.
    plan: free
    databaseName: smm
    user: smm

services:
  - type: web
    name: smm-staging-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Free tier — no card required, but the instance spins down after
    # ~15 minutes idle and cold-starts (10s+) on the next request. Fine for
    # staging; not what you want for anything latency-sensitive.
    plan: free
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smm-staging-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Auto-generated by Render — fine for JWT_SECRET, which has no format
      # requirement beyond "long and secret".
      - key: JWT_SECRET
        generateValue: true
      # NOT auto-generated: TokenCipherService requires exactly 32 raw bytes
      # of base64, which Render's generic generateValue does not guarantee.
      # Set manually — see DEPLOYMENT.md for the exact generation command.
      - key: SOCIAL_TOKEN_ENCRYPTION_KEY
        sync: false
      # Set manually once the Vercel staging URL exists — see DEPLOYMENT.md.
      - key: WEB_ORIGIN
        sync: false
